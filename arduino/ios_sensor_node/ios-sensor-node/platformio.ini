; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; data_dir is a [platformio] option (ignored under [env:*]).
; From this project dir, ../../../dashboard is the repo dashboard/.
[platformio]
data_dir = ../../../dashboard

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1         ; change this if you have a specific board
                           ; (e.g. esp32-s3-devkitc-1, esp32-c3-devkitm-1)s
                           ; run `pio boards esp32` to list options
framework = arduino

monitor_speed = 115200

lib_deps =
    ESP32Async/ESPAsyncWebServer
    ESP32Async/AsyncTCP
    bblanchon/ArduinoJson@^7
    adafruit/RTClib@^2.1.4
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14

board_build.filesystem = littlefs
